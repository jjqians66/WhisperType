name: WhisperType
options:
  bundleIdPrefix: com.whispertype
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"

packages:
  HotKey:
    url: https://github.com/soffes/HotKey
    from: "0.2.1"
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: "4.2.2"

targets:
  WhisperType:
    type: application
    platform: macOS
    sources:
      - WhisperType
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whispertype.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: WhisperType/Info.plist
        GENERATE_INFOPLIST: false
        CODE_SIGN_ENTITLEMENTS: WhisperType/WhisperType.entitlements
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_APP_SANDBOX: false
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - package: HotKey
      - package: KeychainAccess
    entitlements:
      path: WhisperType/WhisperType.entitlements
